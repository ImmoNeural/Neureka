<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neureka</title>
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
  <style>
    /* A pagina de entrada nao aponta para lugar nenhum, de proposito.
       Quem precisa chegar em alguma coisa aqui ja sabe o caminho. */
    :root {
      --bg: #070a0f;
      --text: #e8eef6;
      --font: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui,
              -apple-system, "Helvetica Neue", Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { background: var(--bg); -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      font-family: var(--font);
      color: var(--text);
    }

    /* O mesmo brilho do painel, para as duas paginas parecerem a mesma casa. */
    body::before {
      content: "";
      position: fixed;
      inset: -30% 0 auto 50%;
      width: 900px;
      height: 620px;
      transform: translateX(-50%);
      background: radial-gradient(closest-side, rgba(56, 189, 248, .16), transparent 70%);
      filter: blur(20px);
      pointer-events: none;
      z-index: -1;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 9vw, 52px);
      font-weight: 650;
      letter-spacing: -.02em;
    }
  </style>
</head>
<body>
  <h1>Neureka</h1>
</body>
</html>
