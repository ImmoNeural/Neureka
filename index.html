<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neureka</title>
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
  <style>
    /* Página de entrada. Deliberadamente autocontida: nenhum CSS ou JS externo,
       para que ela continue de pé mesmo se o painel abaixo dela quebrar. */
    :root {
      --bg: #070a0f;
      --surface: #121a24;
      --border: #1f2b3a;
      --border-hi: #2b3a4d;
      --text: #e8eef6;
      --text-muted: #8ea0b5;
      --text-faint: #5d6f85;
      --cold: #38bdf8;
      --font: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui,
              -apple-system, "Helvetica Neue", Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { background: var(--bg); -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      font-family: var(--font);
      color: var(--text);
    }

    /* O brilho de fundo, no mesmo tom do painel, para as duas páginas
       parecerem a mesma casa. */
    body::before {
      content: "";
      position: fixed;
      inset: -30% 0 auto 50%;
      width: 900px;
      height: 620px;
      transform: translateX(-50%);
      background: radial-gradient(closest-side, rgba(56, 189, 248, .16), transparent 70%);
      filter: blur(20px);
      pointer-events: none;
      z-index: -1;
    }

    main { width: 100%; max-width: 460px; text-align: center; }

    .mark {
      width: 54px;
      height: 54px;
      margin: 0 auto 22px;
      color: var(--cold);
    }

    .mark svg { width: 100%; height: 100%; display: block; }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 8vw, 40px);
      font-weight: 650;
      letter-spacing: -.02em;
    }

    .tagline {
      margin: 0 0 34px;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-muted);
    }

    .links { display: grid; gap: 10px; }

    .link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 15px 18px;
      text-align: left;
      text-decoration: none;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      transition: border-color .15s ease, transform .15s ease;
    }

    .link:hover { border-color: var(--border-hi); transform: translateY(-1px); }

    .link:focus-visible {
      outline: none;
      border-color: var(--cold);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, .14);
    }

    .link__name { font-weight: 600; font-size: 15px; }
    .link__desc { margin-top: 3px; font-size: 12.5px; color: var(--text-faint); }
    .link__arrow { flex: none; width: 18px; height: 18px; color: var(--text-faint); }
    .link__arrow svg { width: 100%; height: 100%; display: block; }

    footer {
      margin-top: 34px;
      font-size: 12px;
      color: var(--text-faint);
    }

    @media (max-width: 420px) {
      .link { padding: 13px 15px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2.7c3.4 4.2 6 7.6 6 10.7a6 6 0 0 1-12 0c0-3.1 2.6-6.5 6-10.7Z"/>
      </svg>
    </div>

    <h1>Neureka</h1>
    <p class="tagline">
      Sensores próprios, leitura automática e os números do consumo
      onde dá para olhar sem procurar.
    </p>

    <div class="links">
      <a class="link" href="/medicao/">
        <span>
          <span class="link__name">Medição de água</span>
          <span class="link__desc">Hidrômetros lidos por câmera, cômodo a cômodo</span>
        </span>
        <span class="link__arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
        </span>
      </a>
    </div>

    <footer>Acesso restrito.</footer>
  </main>
</body>
</html>
